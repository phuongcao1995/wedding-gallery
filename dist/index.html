  <!-- Tải sớm ảnh mở đầu (chọn đúng kích thước theo màn hình) -->
  <link rel="preload" as="image" type="image/webp" href="assets/img/hero-2200.webp"
        imagesrcset="assets/img/hero-640.webp 640w, assets/img/hero-1200.webp 1200w, assets/img/hero-2200.webp 2200w" imagesizes="100vw" fetchpriority="high">

  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <a class="skip-link" href="#gallery">Đến phần ảnh</a>

  <header class="site-header" id="siteHeader">
    <a class="monogram" href="#top" aria-label="Về đầu trang" data-initials>P &amp; H</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="chapterNav">Mục lục</button>
    <nav class="chapter-nav" id="chapterNav" aria-label="Mục lục">
      <ul id="chapterList"></ul>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroTitle">
      <div class="hero__media">
        <img id="heroImage" src="assets/img/hero-2200.webp" srcset="assets/img/hero-640.webp 640w, assets/img/hero-1200.webp 1200w, assets/img/hero-2200.webp 2200w" sizes="100vw" width="2200" height="3300" alt="" fetchpriority="high" decoding="async">
      </div>
      <div class="hero__veil" aria-hidden="true"></div>

      <div class="hero__content">
        <h1 class="names" id="heroTitle" tabindex="-1">
          <span class="names__one" data-text="partnerOne">Ngọc Phương</span>
          <span class="names__amp" aria-hidden="true">&amp;</span>
          <span class="sr-only">và</span>
          <span class="names__two" data-text="partnerTwo">Nhật Hạ</span>
        </h1>
        <p class="hero__subtitle" data-text="subtitle">Album cưới</p>
        <span class="hero__rule" aria-hidden="true"></span>
        <p class="hero__date"><time data-date>5 tháng 7, 2025</time></p>
      </div>

      <a class="scroll-cue" href="#gallery" aria-label="Cuộn xuống xem ảnh">
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </section>

    <div class="gallery" id="gallery" tabindex="-1">
      <!-- Chapters and photos are built from the list in script.js -->
      <noscript>
        <p class="noscript">Cần bật JavaScript để xem ảnh.</p>
      </noscript>
    </div>

    <section class="closing" aria-labelledby="closingTitle">
      <div class="closing__inner">
        <figure class="closing__photo">
          <div class="frame closing__frame" id="closingFrame">
            <img id="closingImage" alt="" loading="lazy" decoding="async">
          </div>
        </figure>

        <div class="closing__text reveal">
          <blockquote class="closing__quote">
            <p>Cảm ơn bạn đã xem album của chúng mình.</p>
          </blockquote>

          <svg class="sprig" viewBox="0 0 220 40" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
              <path d="M10 22 H86" />
              <path d="M134 22 H210" />
              <path d="M30 22 C 34 15, 40 13, 46 14 C 42 19, 37 22, 30 22 Z" />
              <path d="M54 22 C 58 29, 64 31, 70 30 C 66 25, 61 22, 54 22 Z" />
              <path d="M190 22 C 186 15, 180 13, 174 14 C 178 19, 183 22, 190 22 Z" />
              <path d="M166 22 C 162 29, 156 31, 150 30 C 154 25, 159 22, 166 22 Z" />
              <path d="M110 31 C 98 23, 96 14, 103 12 C 107 11, 109 13, 110 16 C 111 13, 113 11, 117 12 C 124 14, 122 23, 110 31 Z" />
            </g>
          </svg>

          <h2 class="closing__names" id="closingTitle" data-names>Ngọc Phương &amp; Nhật Hạ</h2>
          <p class="closing__date"><time data-date>5 tháng 7, 2025</time></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Trân trọng, <span data-names>Ngọc Phương &amp; Nhật Hạ</span></p>
    <button class="share-btn" id="shareBtn" type="button">Chia sẻ album</button>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="Lên đầu trang">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" hidden>
    <svg class="music-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="icon-play" d="M8 5.5v13l10-6.5z" fill="currentColor"/>
      <g class="icon-pause" fill="currentColor"><rect x="7" y="5.5" width="3.2" height="13" rx="1"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1"/></g>
    </svg>
    <span class="music-toggle__label">Bật nhạc</span>
  </button>
  <audio id="bgMusic" preload="none" loop></audio>

  <p class="setup-note" id="setupNote" role="status" hidden></p>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
    <div class="lightbox__top">
      <p class="lightbox__counter" aria-live="polite">
        <span class="sr-only">Ảnh</span>
        <span id="lbCurrent">01</span> <span aria-hidden="true">/</span><span class="sr-only">trên</span> <span id="lbTotal">30</span>
      </p>
      <button class="lb-btn lb-btn--close" id="lbClose" type="button" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="lightbox__stage" id="lbStage">
      <img class="lightbox__img" id="lbImage" alt="" decoding="async">
      <p class="lightbox__missing" id="lbMissing" hidden></p>
      <button class="lb-btn lb-btn--prev" id="lbPrev" type="button" aria-label="Ảnh trước">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="lb-btn lb-btn--next" id="lbNext" type="button" aria-label="Ảnh sau">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p class="lightbox__caption" id="lbCaption"></p>
  </div>
</body>
</html>
